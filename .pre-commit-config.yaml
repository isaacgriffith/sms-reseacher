repos:
  - repo: local
    hooks:
      # Runs first: a mutated tree makes every check below meaningless, because
      # a surviving mutant is by definition one the tests cannot detect.
      - id: mutation-artifacts
        name: mutation artifacts (cosmic-ray leakage)
        language: system
        entry: python3 scripts/check_mutation_artifacts.py
        pass_filenames: true
        types: [python]

      # A module beside a same-named package never executes. Scans the whole
      # tree rather than staged files, because the defect is a relationship
      # between two paths — staging only one of them still creates it.
      - id: shadowed-modules
        name: shadowed modules (dead Python files)
        language: system
        entry: python3 scripts/check_shadowed_modules.py
        pass_filenames: false
        types: [python]

      - id: ruff-check
        name: ruff check (Python lint)
        language: system
        entry: uv run ruff check
        # Test trees were added 2026-08-08. They had never been linted, which is
        # the same hole that let two unlinted scripts reach the tree before
        # `scripts` was added here. D1xx is exempted under tests/** via each
        # package's pyproject.toml.
        args:
          [
            "backend/src",
            "agents/src",
            "db/src",
            "agent-eval/src",
            "researcher-mcp/src",
            "scripts",
            "backend/tests",
            "agents/tests",
            "db/tests",
            "agent-eval/tests",
            "researcher-mcp/tests",
          ]
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: ruff format (Python format check)
        language: system
        entry: uv run ruff format --check
        args:
          [
            "backend/src",
            "agents/src",
            "db/src",
            "agent-eval/src",
            "researcher-mcp/src",
            "scripts",
            "backend/tests",
            "agents/tests",
            "db/tests",
            "agent-eval/tests",
            "researcher-mcp/tests",
          ]
        pass_filenames: false
        types: [python]

      - id: mypy
        name: mypy (type check)
        language: system
        entry: uv run mypy
        args:
          [
            "backend/src",
            "agents/src",
            "db/src",
            "agent-eval/src",
            "researcher-mcp/src",
            "scripts",
          ]
        pass_filenames: false
        types: [python]

      - id: pytest
        name: pytest (unit tests)
        language: system
        entry: uv run pytest
        args: ["backend/tests/unit", "agents/tests/unit", "db/tests/unit"]
        pass_filenames: false
        types: [python]

      - id: hadolint-backend
        name: hadolint (backend/Dockerfile)
        language: system
        entry: hadolint
        args: ["backend/Dockerfile"]
        pass_filenames: false
        files: ^backend/Dockerfile$

      - id: hadolint-researcher-mcp
        name: hadolint (researcher-mcp/Dockerfile)
        language: system
        entry: hadolint
        args: ["researcher-mcp/Dockerfile"]
        pass_filenames: false
        files: ^researcher-mcp/Dockerfile$

      - id: hadolint-frontend
        name: hadolint (frontend/Dockerfile)
        language: system
        entry: hadolint
        args: ["frontend/Dockerfile"]
        pass_filenames: false
        files: ^frontend/Dockerfile$
